<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMax slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a12"/>
      <stop offset="55%" stop-color="#0a1622"/>
      <stop offset="100%" stop-color="#0e1f2c"/>
    </linearGradient>

    <linearGradient id="auroraGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd0f4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7fd0f4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="farMountains" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243c4c"/>
      <stop offset="100%" stop-color="#152530"/>
    </linearGradient>

    <linearGradient id="midMountains" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16262f"/>
      <stop offset="100%" stop-color="#0c1720"/>
    </linearGradient>

    <linearGradient id="nearMountains" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a141b"/>
      <stop offset="100%" stop-color="#050b0f"/>
    </linearGradient>

    <linearGradient id="snowCap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dff2fb" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#dff2fb" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1a22"/>
      <stop offset="45%" stop-color="#0a141a"/>
      <stop offset="100%" stop-color="#020608"/>
    </linearGradient>

    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#eaf6ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#bfe4f7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#bfe4f7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- lucht -->
  <rect x="0" y="0" width="1200" height="700" fill="url(#sky)"/>

  <!-- sterren -->
  <g fill="#cdeeff" opacity="0.55">
    <circle cx="80" cy="60" r="1.3"/>
    <circle cx="180" cy="120" r="1"/>
    <circle cx="260" cy="50" r="1.4"/>
    <circle cx="340" cy="140" r="1"/>
    <circle cx="430" cy="80" r="1.2"/>
    <circle cx="520" cy="40" r="1"/>
    <circle cx="610" cy="110" r="1.3"/>
    <circle cx="700" cy="60" r="1"/>
    <circle cx="790" cy="130" r="1.2"/>
    <circle cx="900" cy="70" r="1.4"/>
    <circle cx="980" cy="150" r="1"/>
    <circle cx="1060" cy="90" r="1.3"/>
    <circle cx="1140" cy="50" r="1"/>
    <circle cx="150" cy="200" r="1"/>
    <circle cx="500" cy="180" r="1"/>
    <circle cx="850" cy="190" r="1"/>
    <circle cx="1100" cy="210" r="1"/>
  </g>

  <!-- maan met gloed -->
  <circle cx="950" cy="120" r="150" fill="url(#moon)"/>
  <circle cx="950" cy="120" r="34" fill="#eef8ff" opacity="0.85"/>

  <!-- vage aurora-gloed boven het gebergte -->
  <rect x="0" y="80" width="1200" height="280" fill="url(#auroraGlow)"/>

  <!-- verre bergketen -->
  <path d="M0 320 L60 260 L140 300 L220 230 L300 290 L380 210 L460 280
           L540 240 L620 300 L700 220 L790 285 L870 235 L950 295
           L1040 245 L1120 300 L1200 260 L1200 400 L0 400 Z"
        fill="url(#farMountains)" opacity="0.75"/>

  <!-- middelste bergketen met sneeuwtoppen -->
  <path d="M0 420 L90 320 L170 390 L260 300 L360 400 L450 310 L540 395
           L630 300 L720 400 L820 320 L910 400 L1000 330 L1090 400
           L1200 340 L1200 480 L0 480 Z"
        fill="url(#midMountains)"/>
  <path d="M90 320 L120 355 L60 355 Z
           M260 300 L295 340 L225 340 Z
           M450 310 L480 348 L420 348 Z
           M630 300 L662 340 L598 340 Z
           M820 320 L852 358 L788 358 Z
           M1000 330 L1030 366 L970 366 Z"
        fill="url(#snowCap)"/>

  <!-- voorste, donkere bergketen (silhouet) -->
  <path d="M0 520 L110 430 L210 500 L330 410 L430 500 L560 420
           L670 505 L790 430 L900 510 L1030 435 L1150 505 L1200 460
           L1200 700 L0 700 Z"
        fill="url(#nearMountains)"/>

  <!-- bevroren vlakte / meer met flauwe glans -->
  <rect x="0" y="560" width="1200" height="140" fill="url(#ice)"/>
  <g stroke="#7fd0f4" stroke-opacity="0.12" stroke-width="1">
    <line x1="0" y1="590" x2="1200" y2="580"/>
    <line x1="0" y1="630" x2="1200" y2="622"/>
    <line x1="0" y1="665" x2="1200" y2="660"/>
  </g>
</svg>
